name: Download CUDA Runtime DLLs for qwentts

# Thin caller: the packaging logic lives in exactly one place -
# SeasonRealms/SeasonONNX/.github/workflows/package-cuda-cudnn-runtime.yml.
# This wrapper keeps the SeasonTTS entry point and pins the GGML profile:
# include_cudnn=false, because qwentts.cpp is transformer-based (attention +
# MLP) and its GGML CUDA backend links cuBLAS, never cuDNN.
#
# Artifacts produced by the called workflow:
#   - cuda-runtime-dlls            (CUDA runtime DLLs)
#   - cuda-cudnn-runtime-bundle    (drop-in deployment folder, incl. README.txt)
#   - cuda-cudnn-runtime-metadata  (runtime-manifest.json)

on:
  workflow_dispatch:
    inputs:
      cuda_version:
        description: "CUDA Toolkit version (aligned with OnnxRuntimeMultiEP default)"
        required: true
        default: "12.8.1"

permissions:
  contents: read

jobs:
  download-cuda-dlls:
    uses: SeasonRealms/SeasonONNX/.github/workflows/package-cuda-cudnn-runtime.yml@main
    with:
      cuda_version: ${{ inputs.cuda_version }}
      include_cudnn: false
